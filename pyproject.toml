[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hub"
version = "0.1.0"
description = "Personal app hub — app factory, shared chrome, and module registry"
requires-python = ">=3.10"
dependencies = ["Flask>=3"]

[tool.setuptools]
packages = ["hub"]
include-package-data = true

[tool.setuptools.package-data]
hub = ["templates/*.html"]
